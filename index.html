    <!-- PHẦN STYLE TRANG TRÍ CHO BANNER CHẠY MƯỢT (CSS) -->
    <style>
        .slider-wrapper {
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            position: relative;
            margin-top: 10px; /* Khoảng cách với khối bên trên */
        }
        .slider-container {
            display: table;
            width: 500%; /* Tổng độ rộng bằng số lượng ảnh x 100% (5 ảnh = 500%) */
            transition: transform 0.6s ease-in-out; /* Tốc độ lướt qua mượt mà */
        }
        .slide {
            display: table-cell;
            width: 20%; /* Mỗi ảnh chiếm 1 phần đều nhau (100% / 5 ảnh = 20%) */
            vertical-align: top;
        }
        .slide img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Style cho các nút chấm tròn nhỏ */
        .slider-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin: 0 5px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .dot.active {
            background-color: #00ffcc; /* Màu xanh neon trùng tông nút Đăng Ký của bạn */
            width: 20px; /* Làm chấm tròn dài ra chút nhìn cho sang */
            border-radius: 5px;
        }
    </style>

    <!-- ĐOẠN SCRIPT ĐIỀU KHIỂN TỰ ĐỘNG CHẠY BANNER (JAVASCRIPT) -->
    <script>
        (function() {
            let currentIndex = 0;
            const slides = document.querySelectorAll('.slide');
            const totalSlides = slides.length;
            const sliderContainer = document.getElementById('mainSlider');
            const dots = document.querySelectorAll('.dot');

            function changeSlide() {
                currentIndex++;
                if (currentIndex >= totalSlides) {
                    currentIndex = 0; // Chạy hết 5 tấm thì tự động quay về tấm đầu tiên
                }
                
                // Tính toán khoảng cách lướt sang trái theo phần trăm
                let translateValue = -(currentIndex * 20); 
                sliderContainer.style.transform = `translateX(${translateValue}%)`;
                
                // Cập nhật trạng thái dấu chấm tròn active
                dots.forEach(dot => dot.classList.remove('active'));
                if (dots[currentIndex]) {
                    dots[currentIndex].classList.add('active');
                }
            }

            // Cứ mỗi 3000ms (3 giây) là ảnh tự động lướt lướt qua tấm tiếp theo
            setInterval(changeSlide, 3000);
        })();
    </script>
