<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBOSS Official Site</title>
    <style>
        /* 1. Cài đặt màu nền đen tuyền cho toàn bộ trang web */
        body {
            background-color: #05070c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 2. Style cho phần chữ tiêu đề phía trên */
        .brand-title {
            color: #ff2a6d; /* Màu hồng neon */
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .sub-title {
            color: #cccccc;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .main-heading {
            font-size: 36px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        /* 3. Style cho thanh Menu (Logo + Nút bấm) */
        .navbar {
            background-color: #0b111e; /* Nền xanh đen tối */
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            color: #00ffff; /* Màu Cyan của logo */
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 20px; /* Bo tròn nút */
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-cskh {
            background-color: transparent;
            color: #00ffff;
            border: 1px solid #00ffff;
        }

        .btn-register {
            background-color: #00a2ff; /* Màu xanh dương của nút Đăng Ký */
            color: #ffffff;
            border: none;
        }

        /* 4. Style cho hàng nút chọn ngôn ngữ */
        .lang-bar {
            margin-top: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .lang-btn {
            background-color: #162235;
            color: #999999;
            padding: 6px 12px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 13px;
        }

        .lang-btn.active {
            background-color: #00a2ff;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Phần chữ tiêu đề -->
        <div class="brand-title">UBOSS</div>
        <div class="sub-title">Official Site | Sportsbook & Casino | Fast USDT Withdrawals</div>
        <div class="main-heading">UBOSS | Licensed Online Sportsbook & Casino | Fast USDT Withdrawals</div>

        <!-- Thanh Menu điều hướng -->
        <div class="navbar">
            <div class="logo">💎 UBOSS</div>
            <div class="nav-buttons">
                <!-- https://t.me/Jenniii666 -->
                <a href="#" class="btn btn-cskh">💬 CSKH</a>
                <!-- https://97y.me/YujfJ -->
                <a href="#" class="btn btn-register">🎮 Đăng Ký</a>
            </div>
        </div>

        <!-- Hàng nút chọn ngôn ngữ -->
        <div class="lang-bar">
            <a href="#" class="lang-btn active">Tiếng Việt</a>
            <a href="#" class="lang-btn">English</a>
            <a href="#" class="lang-btn">简体中文</a>
            <a href="#" class="lang-btn">한국어</a>
            <a href="#" class="lang-btn">日本語</a>
        </div>
    </div>

</body>
</html>
